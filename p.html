<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>VALE Connect | Public Card Preview</title><style>

"account-lists.js?v=7"></script><script src="cloud-connections-core.js?v=11"></script><script src="cloud-save-ui.js?v=7"></script><script>
(async()=>{'use strict';
const $=id=>document.getElementById(id);
const slug=new URLSearchParams(location.search).get('u')||'';
if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)||slug.length<3||slug.length>60){$('status').textContent='Invalid card link.';return}
if(!window.supabase){$('status').textContent='Connection unavailable. Try again later.';return}
const client=window.supabase.createClient('https://jlprxnmdvoloahssjlnu.supabase.co','sb_publishable_wxT0A5bByFX67J1ut0F-ZA_xITdxwf_');
client.auth.getUser().then(({data})=>window.dispatchEvent(new CustomEvent('vale-account-ready',{detail:{client,user:data?.user||null}}))).catch(()=>{});
client.auth.onAuthStateChange((_event,session)=>window.dispatchEvent(new CustomEvent('vale-account-ready',{detail:{client,user:session?.user||null}})));
try{
 const {data:found,error}=await client.rpc('get_public_card',{card_slug:slug});
 if(error)throw error;
 const data=found?.[0]||null;
 if(!data){$('status').textContent='This card is not available.';return}
 $('name').textContent=data.display_name;$('title').textContent=data.job_title;$('company').textContent=data.business_name;$('intro').textContent=data.introduction;
 const add=(label,href)=>{const a=document.createElement('a');a.textContent=label;a.href=href;a.target='_blank';a.rel='noopener noreferrer';$('links').append(a)};
 if(data.public_email)add('Email','mailto:'+encodeURIComponent(data.public_email));
 if(data.public_phone)add('Call','tel:'+data.public_phone.replace(/[^+\d]/g,''));
 const safeURL=(s)=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};
 if(data.website){const u=window.ValeConnections.website(data.website);if(u)add('Website',u)}
 for(const line of (data.social_links||'').split('\n')){const [label,...parts]=line.split('|');const u=safeURL(parts.join('|').trim());if(label&&u)add(label.trim(),u)}
 const save=document.createElement('button');save.type='button';save.textContent='Save to contacts (.vcf)';save.style.cssText='padding:12px;border-radius:10px;cursor:pointer';
 save.onclick=()=>{const body=window.ValeCardTools.vcard(window.ValeCardTools.toEditor(data));const url=URL.createObjectURL(new Blob([body],{type:'text/vcard;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='vale-connect-contact.vcf';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
 $('links').append(save);window.ValeConnectionUI?.mount('publicConnectionSave',window.ValeCardTools.toEditor(data),{cardId:data.id,url:location.href});window.ValeCloudSave?.mount('publicCloudSave',window.ValeCardTools.toEditor(data),{cardId:data.id,url:location.href});
 $('status').hidden=true;$('profile').hidden=false;document.title=data.display_name+' | VALE Connect';
}catch(e){$('status').textContent='Unable to load card. Check that public cards are configured.';console.error('Public card load failed',e)}
})();
</script></body></html>
